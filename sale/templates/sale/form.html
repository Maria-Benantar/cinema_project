{% extends 'base.html' %}

{% block title %}{{ action }} Sala - Cinema Management System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="page-title">{{ action }} Sala</h1>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Sala</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ sala.nome }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="numero_posti" class="form-label">Numero Posti Totali</label>
                        <input type="number" class="form-control" id="numero_posti" name="numero_posti" value="{{ sala.numero_posti }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="numero_file" class="form-label">Numero File</label>
                                <input type="number" class="form-control" id="numero_file" name="numero_file" value="{{ sala.numero_file|default:10 }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="posti_per_fila" class="form-label">Posti per Fila</label>
                                <input type="number" class="form-control" id="posti_per_fila" name="posti_per_fila" value="{{ sala.posti_per_fila|default:10 }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Salva</button>
                        <a href="{% url 'sale_lista' %}" class="btn btn-outline-secondary">Annulla</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
