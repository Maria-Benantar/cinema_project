{% extends 'base.html' %}

{% block title %}{{ action }} Film - Cinema Management System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="page-title">{{ action }} Film</h1>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="titolo" class="form-label">Titolo</label>
                        <input type="text" class="form-control" id="titolo" name="titolo" value="{{ film.titolo }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="descrizione" class="form-label">Descrizione</label>
                        <textarea class="form-control" id="descrizione" name="descrizione" rows="4">{{ film.descrizione }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="regista" class="form-label">Regista</label>
                                <input type="text" class="form-control" id="regista" name="regista" value="{{ film.regista }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="genere" class="form-label">Genere</label>
                                <input type="text" class="form-control" id="genere" name="genere" value="{{ film.genere }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="durata_minuti" class="form-label">Durata (minuti)</label>
                                <input type="number" class="form-control" id="durata_minuti" name="durata_minuti" value="{{ film.durata_minuti }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="anno_uscita" class="form-label">Anno Uscita</label>
                                <input type="number" class="form-control" id="anno_uscita" name="anno_uscita" value="{{ film.anno_uscita }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="rating" class="form-label">Rating (0-10)</label>
                        <input type="number" class="form-control" id="rating" name="rating" step="0.1" min="0" max="10" value="{{ film.rating|default:0 }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Salva</button>
                        <a href="{% url 'film_lista' %}" class="btn btn-outline-secondary">Annulla</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
